name: Build & Test Chap Niem Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Validate server syntax & core modules
      run: node -e "import('./server.js').then(() => { console.log('Syntax OK'); process.exit(0); }).catch(err => { console.error(err); process.exit(1); })"

    - name: Verify Docker build
      run: docker build -t chap-niem:latest .
